<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ort sweep</title></head>
<body><pre id="out">running</pre>
<script>
// ?v=1.31.1  -- loads that ort-web build, runs the spec'd preprocessing on
// check_image.jpg and publishes the result on window.__RESULT.
const P = new URLSearchParams(location.search);
const V = P.get('v') || '1.31.1';
const DIST = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${V}/dist/`;
const log = [];
window.__RESULT = null;

function done(o) {
  window.__RESULT = o;
  document.getElementById('out').textContent = JSON.stringify(o, null, 1);
}

const s = document.createElement('script');
s.src = DIST + 'ort.min.js';
s.onerror = () => done({ v: V, error: 'script load failed' });
s.onload = main;
document.head.appendChild(s);

async function main() {
  try {
    ort.env.wasm.wasmPaths = DIST;
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.proxy = false;

    const sess = await ort.InferenceSession.create('leaf_model.onnx',
      { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    const meta = JSON.parse(sess.meta?.customMetadataMap?.model_info || '{}');
    const size = meta.input_size || 96;
    const mean = meta.mean || [0.485, 0.456, 0.406];
    const std = meta.std || [0.229, 0.224, 0.225];

    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej;
      img.src = 'check_image.jpg?x=' + Date.now(); });

    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, (img.naturalWidth - side) >> 1, (img.naturalHeight - side) >> 1,
                  side, side, 0, 0, size, size);
    const d = ctx.getImageData(0, 0, size, size).data;
    const n = size * size, t = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) {
      const p = i * 4;
      t[i] = (d[p] / 255 - mean[0]) / std[0];
      t[n + i] = (d[p + 1] / 255 - mean[1]) / std[1];
      t[2 * n + i] = (d[p + 2] / 255 - mean[2]) / std[2];
    }

    const feeds = {};
    feeds[sess.inputNames[0]] = new ort.Tensor('float32', t, [1, 3, size, size]);
    const out = await sess.run(feeds);
    const raw = Array.from(out[sess.outputNames[0]].data);
    const mx = Math.max(...raw);
    const ex = raw.map(x => Math.exp(x - mx));
    const sum = ex.reduce((a, b) => a + b, 0);
    const probs = ex.map(x => x / sum);
    const classes = meta.classes || [];
    const expected = await (await fetch('check_expected.json')).json();
    let maxDev = 0;
    classes.forEach((c2, i) => {
      if (typeof expected[c2] === 'number') maxDev = Math.max(maxDev, Math.abs(probs[i] - expected[c2]));
    });
    done({
      v: V, ortVersion: ort.version, input: sess.inputNames[0], output: sess.outputNames[0],
      classes, probs: probs.map(p => +p.toFixed(6)), maxDevVsExpected: maxDev,
      crossOriginIsolated: self.crossOriginIsolated, numThreads: ort.env.wasm.numThreads
    });
  } catch (e) {
    done({ v: V, error: String(e && (e.stack || e.message) || e), type: typeof e,
           keys: Object.keys(Object(e)) });
  }
}
</script></body></html>
